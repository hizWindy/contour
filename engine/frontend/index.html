<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The content policy, the same as the Caddyfile's. The speech model on a phone (PLAN-V24 T4-1)
         runs as WebAssembly in a Web Worker from our own site: scripts may compile WebAssembly
         ('wasm-unsafe-eval', never 'unsafe-eval'), and a worker may come from our own site only. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self'; worker-src 'self'; base-uri 'none'; object-src 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <!-- The website as an app (Improvements 1, #9): the manifest, the colour of the browser bar
         (the page's own, kept in step with the theme by src/shell/theme.ts), and what iOS reads
         for "Add to Home Screen". -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F4F5EF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Contour" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The two weights of the body font that the first screen uses start downloading with the page, not
         after the styles are read (PLAN-V7 D3). The build puts in the hashed file names. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/titillium-web/files/titillium-web-latin-400-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/titillium-web/files/titillium-web-latin-600-normal.woff2"
    />
    <title>Contour</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Dialogs, menus and tooltips are added after this empty box, so the app's own box is never
         the last one in the page. When it stopped being the last, the browser worked out again the
         look of every button on the page as each one opened (PLAN-V23 T4-4: about 2 ms at 4x CPU
         slowdown on Today, more on a longer page). -->
    <div hidden></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
