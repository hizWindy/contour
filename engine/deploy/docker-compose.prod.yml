# Contour HQ, everything together (PLAN-V6 G3). The run book is README.md in this folder.
#
#   On the server (a managed database):   docker compose up -d --build
#   On a laptop (a database of its own):  the same, with COMPOSE_PROFILES=trial in .env
#
# Four parts, on one private network:
#   web      Caddy. The only part open to the internet (ports 80 and 443). HTTPS, the website's files,
#            /api sent to the backend, the security headers.
#   backend  The engine. One copy only: the engine runs one backend for each database (it takes an
#            advisory lock), so never scale this up.
#   migrate  `engine migrate`, once, before the backend starts.
#   db       A Postgres of its own with pgvector, for the trial only (profile "trial"). On the server
#            the database is a managed one and this part is not started.
#
# The keys are in the file named .env next to this one (copy .env.example, mode 600). It is never in
# git. TAG names the images (the git commit, for a rollback): TAG=$(git rev-parse --short HEAD).

name: contour

# Docker keeps a container's log for ever unless told not to, and Caddy writes a line for each
# request. This keeps the last 5 files of 10 MB for each part, so the logs can't fill the server's disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  web:
    image: contour-web:${TAG:-local}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    logging: *logging
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env, like hq.contourinteriors.com.au}
      HSTS: ${HSTS:-max-age=31536000}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # The certificates. Keep them: a new volume asks Let's Encrypt again, which has limits.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      inside:
        # A fixed address, so the backend can trust this one address and no other (TRUSTED_PROXIES).
        ipv4_address: 172.28.0.2
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  backend:
    image: contour-backend:${TAG:-local}
    build:
      context: ../backend
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      SERVER_MODE: "true"
      PUBLIC_ORIGIN: https://${SITE_ADDRESS}
      # Only Caddy's address may say who a visitor is.
      TRUSTED_PROXIES: 172.28.0.2
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      # 5432 is the port inside Docker. (The engine's own default, 5433, is the laptop's mapping.)
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The health check is in the image (/api/v1/health).
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - inside

  migrate:
    image: contour-backend:${TAG:-local}
    build:
      context: ../backend
    command: ["engine", "migrate"]
    restart: "no"
    logging: *logging
    env_file: .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    depends_on:
      db:
        condition: service_healthy
        required: false # not started on the server: its database is a managed one
    networks:
      - inside

  db:
    profiles: ["trial"]
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-leadfinder}
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - inside

networks:
  inside:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          # The other parts get their addresses from the upper half only, so the fixed address of
          # Caddy (172.28.0.2) is never taken by one of them first.
          ip_range: 172.28.0.128/25
          gateway: 172.28.0.1

volumes:
  caddy-data:
  caddy-config:
  pgdata:
