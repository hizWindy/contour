[project]
name = "contour-engine"
version = "0.1.0"
description = "Contour research engine: a shared core, plus the Lead Finder."
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "anthropic>=2.3.0",
    "fastapi",
    "fastembed",
    "openpyxl",
    "pgvector",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "pyyaml",
    "sqlalchemy[asyncio]",
    "uvicorn[standard]",
]

[project.scripts]
engine = "core.cli:main"
lead-finder = "apps.lead_finder.cli:main"

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "types-openpyxl",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "apps"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["core", "apps", "tests"]
exclude = ["core/db/migrations/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastembed.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs the database, and downloads the memory model once"]
