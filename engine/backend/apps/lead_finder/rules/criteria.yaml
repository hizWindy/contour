# Lead Finder company criteria.
# Source: projects/leads/criteria/Criteria_v2.md (a draft until Levi confirms it, 30 Oct 2026).
# Version 1 is Criteria_v1.md. This file is version 2, built on the branch engine-criteria-v2.
# Edit this file when Levi changes a rule. The backend checks it at start-up and won't
# start if it's wrong. Anything not confirmed is listed under "tbc" at the bottom.

label: Draft version 2, 30 Oct 2026

cities:
  pass: [Melbourne, Adelaide, Perth]
  director_review: [Sydney]
  other_cities: director_review # "Sydney or another city" goes to a Director

size:
  staff_min: 100 # the brief's "100+ in one office". The HubSpot watchlist lists companies from here
  staff_hint_min: 75 # the Profile's "75+ office staff". When judging a lead, a size worked out from staff is only a hint: below this it gets a "check office size" flag, never a Drop
  staff_max: 600 # over this goes to Director review (a possible Whale Pipeline project)
  staff_counted_in: city
  office_m2_min: 1000
  office_m2_max: 6000
  m2_per_staff: 10 # used only when the office size isn't known
  director_band_m2: [800, 1000] # a KNOWN office just under the minimum goes to a Director, not Drop
  linkedin_staff_multiplier: 2 # real staff is about LinkedIn staff x 2
  grow_into_range_months: 24 # a small company that will need an office in range within this long still fits
  # Where to look for staff numbers, in this order (Criteria_v2.md section 2). hubspot and
  # headcount_tool each fill a gap the research left. They never overwrite a figure.
  # headcount_tool (Signal Hire: core/signalhire, apps/lead_finder/headcount.py) is ON since 2 Nov,
  # at Al-khair's say, before the PLAN-V3 test of 5 companies (A4, B1). It also needs
  # SIGNALHIRE_API_KEY in engine/.env. To turn it off, take it out of this list, or empty the key.
  # linkedin is the LinkedIn count, doubled.
  staff_sources: [hubspot, headcount_tool, linkedin, web_research]
  # Signal Hire counts the people it has on file in the city, and the real staff is about that
  # times this. Our guess until the PLAN-V3 test (A4, B1) gives the real ratio.
  headcount_tool_multiplier: 2
  # required: use a Signal Hire count only when its Company API has matched the company name to one
  # of its own company pages. optional: also use the name as typed when it can't be checked, and
  # the lead card says so. Signal Hire's Company API is off for our account (a 403, checked 2 Nov),
  # so required would count nothing. Use optional until its support switches the Company API on,
  # then required, because a short or common name can match other companies' people.
  headcount_tool_name_check: optional

fitout:
  rate_per_m2_aud: 1500 # the minimum rate in the deal criteria

industries:
  director_review:
    - Government
    - Education
    - Industry consultants
    - Law firms
    - Premium banks and finance
    - Real estate agencies
    - Standard not-for-profits
    - Hospitals and healthcare
  check_office_size: # site-heavy industries. Only a hint: a flag when it isn't clear that the office matters
    - Construction
    - Civil engineering
    - Mining and metals
    - Machinery
    - Manufacturing
    - Food and beverages
    - Retail
    - Automotive
    - Hospitality
    - Transport and logistics
  # Industry tiers from the Target Customer Profile. A tier adds points to the score. It never
  # decides whether a company fits.
  tier_1:
    - Energy and infrastructure
    - Mining and resources
    - Technology and telecommunications
    - Engineering and technical services
  tier_2:
    - Defence and advanced manufacturing
    - Life sciences and medtech
    - Selected financial and corporate services
    - Other corporate professional services

fit:
  local_team_runs_project: true
  healthy: true # not in administration, and not cutting staff fast

office_age:
  due_years: 5 # more than this many years at the same address adds points (Levi's brief says 5 to 8)
  recent_move_years: 3 # a move or fitout in the last 3 years lowers the rank

triggers:
  window_years: 3
  best_window_years: [1, 3]
  recent_months: 12 # an event, like a merger, counts if it happened in the last 12 months
  consultant_window_months: 18 # the Profile: a consultant is usually appointed this long before the project. The lead card says so as text, because the tool can't see it
  main:
    - id: lease_ending
      label: Lease ending in 1 to 3 years, or a relocation
    - id: merger_or_takeover
      label: Merger or acquisition, where one company has an old office
    - id: big_new_contract
      label: Big new contract or project award, needing about 100 more office staff
    - id: fast_growth
      label: Fast or planned headcount growth, like many job ads, big funding or growth news
  other:
    - id: office_consolidation
      label: Merging several offices into one
    - id: return_to_office
      label: Return to office
    - id: restructure
      label: Restructure
    - id: new_ceo # the id stays, so old leads keep their label. Moved up from weak in version 2
      label: Leadership change that changes direction or strategy
    - id: new_business_unit
      label: New business unit
    - id: new_facility
      label: New engineering, project or manufacturing facility with a big office part
    - id: underperforming_workplace
      label: Underperforming workplace, or a major business or industry change
  weak:
    - id: culture_change
      label: Culture change
    - id: hiring_push # the id stays. The label is the Profile's wording
      label: Pressure on talent, client experience or productivity, like a hiring push

# What Claude may report as evidence for the score. Each earns points in a score check below,
# except can_pay: the Profile has no place for it, so it only shows on the card (and may break ties).
boosters:
  - id: buys_strategy
    label: Talks about culture, hybrid work or green-building ratings (NABERS, Green Star), and hires firms directly
  - id: no_rival_in_place
    label: Not in a competitor's case studies from the last 5 years
  - id: can_pay
    label: Profitable, growing or recently raised money

never_suggest:
  already_sent: true
  open_deal: true
  dissolved_deal_wait_months: 12
  do_not_contact: true

sources_rank: [property_daily, asx_or_official_news, other_news, job_ads]

# Which websites count as which kind of source. A site matches its subdomains too.
# Anything not listed is other_news. The company's own website counts as official.
source_domains:
  property_daily: [] # off in version 1
  asx_or_official_news: [asx.com.au, gov.au, wgea.gov.au, abr.business.gov.au, asic.gov.au]
  job_ads: [seek.com.au, indeed.com, jora.com, linkedin.com, glassdoor.com]
  blocked: # sites we never read: contact-data sellers (personal data), and Property Daily
    - propertydaily.com.au # off until its terms allow a program to read it (TBC with Levi)
    - zoominfo.com
    - rocketreach.co
    - signalhire.com
    - contactout.com
    - lusha.com
    - apollo.io

# The score, 0 to 100: the Target Customer Profile's six parts (Criteria_v2.md section 6). The parts
# add up to 100, and the checks inside each part add up to the part (the backend checks this).
# The checks and their points are our proposal, TBC until Levi fills in the Importance column.
# A check is "not known yet" when the tool can't judge it for a lead, and then it adds nothing to
# "checked". The tool shows points earned out of points checked, like "48 of 60 checked".
score:
  parts:
    trigger: { label: Business or property trigger, points: 25 }
    size: { label: Project size, points: 20 }
    timing: { label: Timing, points: 15 }
    access: { label: Decision-maker access, points: 15 }
    fit: { label: Integrated strategic fit, points: 15 }
    competition: { label: Competitive opportunity, points: 10 }
  check_labels:
    trigger_group: The best trigger
    source: How strong its source is
    size: Office size
    recency: How recent the trigger is, or how near the lease end
    years_at_address: Years at the same address
    no_recent_move: No recent move or fitout
    contact_role: A contact role found
    hubspot_contact: A contact already in HubSpot
    customer_link: A link to a current customer
    buys_strategy: Talks about culture, hybrid work or green ratings
    industry_tier: Industry tier
    no_rival_in_place: Not in a competitor's case studies
    no_contractor_relationship: No known fitout contractor relationship
  trigger_group: { main: 15, other: 10, weak: 4 } # the best trigger counts
  source: { property_daily: 10, asx_or_official_news: 8, other_news: 5, job_ads: 2 }
  size: { confirmed_in_range: 20, estimated_in_range: 16, growing_into_range: 14, director: 10 }
  recency: # timing: how long ago the best trigger happened
    - { within_days: 30, points: 6 }
    - { within_days: 90, points: 4 }
    - { within_days: 365, points: 2 }
  undated: 1
  lease_in_best_window: 6 # a lease ending 1 to 3 years out
  years_at_address: 5 # more than office_age.due_years at the same address
  no_recent_move: 4 # no move or fitout in the last office_age.recent_move_years
  access: { contact_role: 5, hubspot_contact: 5, customer_link: 5 }
  fit: { buys_strategy: 8, tier_1: 7, tier_2: 4 }
  competition: { no_rival_in_place: 6, no_contractor_relationship: 4 }
  unseen: [hubspot_contact, customer_link, no_contractor_relationship] # the tool can't judge these yet
  bands: { research_first: 75, investigate: 50 } # under investigate is "nurture" (the Profile)
  band_basis: scaled # scaled: points earned out of points checked, then x100. raw: points earned

results: [pass, director_review, watch, drop]

# The Profile's stage for each result (Criteria_v2.md section 8). The tool decides only these
# first stages. The third, a qualified deal, comes after sales meets the client (DEAL.md).
stages:
  pass: Active prospect
  director_review: Active prospect
  watch: Target account
  drop: Not a target

tbc:
  - key: size.staff_counted_in
    note: Question 6. Does 100+ staff mean in that city, or across the whole company?
  - key: size.m2_per_staff
    note: Question 8. Is 10 m² per person right?
  - key: size.staff_hint_min
    note: Levi's brief says 100+ in one office. The Profile says 75+. We start at 75, because a flag costs less than a missed lead. Levi picks, and then staff_min should match.
  - key: size.staff_sources
    note: The order from the 27 Oct meeting. HubSpot first, then a headcount tool (Signal Hire), then LinkedIn doubled, then the AI's web research. Signal Hire is on since 2 Nov, before its test (PLAN-V3 A4, B1) shows how far its counts can be trusted. Our export has a LinkedIn staff count for most offices, but no office size, no manual headcount, and almost no lease expiry or last-moved dates.
  - key: size.headcount_tool_multiplier
    note: Signal Hire counts only the people it has on file, which is fewer than the real staff. 2 is our guess, like LinkedIn. The test of 5 companies (PLAN-V3 A4) gives the real ratio, and B1 sets the number. Levi confirms.
  - key: size.headcount_tool_name_check
    note: A short or common name can match other companies' people. required uses a Signal Hire count only when its Company API has matched the company name. optional also uses the name as typed, and the lead card says the name was not checked. Signal Hire's Company API is off for our account (checked 2 Nov), so we use optional for now, and required once its support switches the Company API on. Levi confirms, after the test shows whether the two give the same counts.
  - key: size.grow_into_range_months
    note: Levi's 29 Oct email says a small company that will soon grow into the range counts (Southern Launch, 30 to 40 staff, funding for 150). He didn't say how soon. 24 months is our guess.
  - key: size.director_band_m2
    note: Relaxes Levi's 1,000 m² rule. Alvarez & Marsal at 800 m² is Contour Validated.
  - key: size.linkedin_staff_multiplier
    note: LinkedIn shows about half the real staff (median 0.51 across 19 HubSpot companies).
  - key: industries.check_office_size
    note: Version 2 judges the office, not the industry (a miner's head office counts). A site-heavy industry gets a flag only when the AI can't tell whether the office matters. The AI's "the office doesn't matter" is flagged, not dropped, because it is a judgement.
  - key: industries.tier_1
    note: From the Target Customer Profile, which leadership hasn't approved. Question 1 for Levi.
  - key: industries.tier_2
    note: Defence is Tier 2 today, but 5 of the 23 Gold customers are defence or secure sites. Question 1 for Levi.
  - key: fit.local_team_runs_project
    note: Was "decides locally". Some of Contour's clients are owned overseas.
  - key: fit.healthy
    note: Our proposal.
  - key: triggers.best_window_years
    note: Our proposal. Closer than 1 year, a consultant is probably already hired.
  - key: boosters
    note: The three kinds of evidence Claude may report. All our proposals. can_pay is not scored, because the Profile has no place for it (TBC, use it only to break ties).
  - key: never_suggest.dissolved_deal_wait_months
    note: The 12 months is a guess.
  - key: office_age.due_years
    note: Levi's brief says 5 to 8 years at the same address. Gemini's meeting summary said 7 to 8, and the written sources win. We start at the low end, 5, because it adds points and never filters.
  - key: office_age.recent_move_years
    note: Answered by the documents. A recent move or fitout means the last 3 years.
  - key: triggers.consultant_window_months
    note: From the Profile and DEAL.md. Shown as text on the lead card. The tool can't see when a consultant is appointed.
  - key: triggers
    note: Version 2 adds three triggers (new facility, new business unit, underperforming workplace) and moves the leadership change up from weak to other, counting only when strategy changes. All from the Profile and Levi's brief, none confirmed.
  - key: triggers.recent_months
    note: Our proposal. How old an event can be and still count as a trigger.
  - key: source_domains
    note: First draft. The test set will show which sites matter.
  - key: score
    note: The six parts are the Profile's, which leadership hasn't approved. The checks inside them and all their points are our proposal, until Levi fills in the Importance column. Three checks can't be judged yet (a contact in HubSpot, a link to a current customer, no known contractor relationship).
  - key: score.band_basis
    note: Our proposal. With scaled, 48 of 60 checked counts as 80 for the band. Raw would use 48.
