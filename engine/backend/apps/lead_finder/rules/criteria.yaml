# Lead Finder company criteria.
# Source: projects/leads/criteria/Criteria_v2.md (a draft until Levi confirms it, 30 Oct 2026).
# Version 1 is Criteria_v1.md. This file is version 2, built on the branch engine-criteria-v2, with
# Levi's 9 Nov changes (PLAN-V11, Criteria_v2.md section 1).
# Edit this file when Levi changes a rule. The backend checks it at start-up and won't
# start if it's wrong. Anything not confirmed is listed under "tbc" at the bottom.

label: Draft version 2, 30 Oct 2026, with Levi's 9 Nov changes

cities:
  # All of Australia (PLAN-V16 T1-2, Al-khair 15 Nov; Criteria_v3.md section 2). Levi's notes name
  # Melbourne, Adelaide and Perth (priority), and Sydney and Brisbane (secondary). The other places
  # are our list, TBC with Levi. Every place passes the location filter, and a place that isn't
  # listed passes too, with the flag "check the city". The group only changes the city points.
  groups:
    priority: [Melbourne, Adelaide, Perth]
    secondary: [Sydney, Brisbane] # Sydney was a Director's decision in version 2
    capital: [Canberra, Hobart, Darwin]
    regional:
      - Gold Coast
      - Newcastle
      - Sunshine Coast
      - Wollongong
      - Geelong
      - Townsville
      - Cairns
      - Toowoomba
      - Ballarat
      - Bendigo
      - Launceston
      - Mackay
  # Not a place: the name of the run choice that searches all of Australia at once, one search for
  # each sign, and asks Claude which city each company's office is in (PLAN-V16 choice 10).
  national: Australia
  # A lead with one of these signs and no city at all goes to a Director, not to Watch. An overseas
  # company new to Australia must name an Australian city to pass (30 Oct decision, PLAN-V9 B3).
  no_city_director_signs: [new_to_australia]

size:
  staff_min: 50 # Levi, 9 Nov: 50+ staff fits (PLAN-V11 B2; was 100, the brief's "100+ in one office"). The HubSpot watchlist lists companies from here
  staff_hint_min: 50 # Levi, 9 Nov: 50+ staff fits (PLAN-V11 B2; was 75, the Profile's "75+ office staff"). A size worked out from staff between staff_floor and this is a Watch with a "check office size" flag. With both at 50 there is no such band
  staff_floor: 50 # Levi, 5 Nov: "about 50 if growing". A size worked out from staff under this is a Drop, "too small", unless the company is growing (PLAN-V9 B1)
  # The discovery signs that mean a company is growing. A company found with one of these is never
  # stopped before research for being small (PLAN-V9 B2): its size comes from what it plans.
  growth_signs: [fast_growth, big_new_contract, new_to_australia, hot_industry_growth]
  staff_max: 600 # over this goes to Director review (a possible Whale Pipeline project)
  staff_counted_in: city
  office_m2_min: 1000
  office_m2_max: 6000
  m2_per_staff: 10 # used only when the office size isn't known
  director_band_m2: [800, 1000] # a KNOWN office just under the minimum goes to a Director, not Drop
  linkedin_staff_multiplier: 2 # real staff is about LinkedIn staff x 2
  grow_into_range_months: 24 # a small company that will need an office in range within this long still fits
  # Where to look for staff numbers, in this order (Criteria_v2.md section 2). The first source
  # with a number is the one the rules use. The other numbers stay on the lead card, and a big gap
  # between them raises a flag (conflicts.staff_gap_ratio below). A source that isn't listed isn't
  # asked. linkedin is the LinkedIn count the web research read, doubled. web_research is any
  # other number it found.
  # headcount_tool (Signal Hire: core/signalhire, apps/lead_finder/headcount.py) is ON since 2 Nov,
  # at Al-khair's say, before the PLAN-V3 test of 5 companies (A4, B1). It also needs
  # SIGNALHIRE_API_KEY in engine/.env. To turn all of it off (the staff count, the company details
  # and the senior people), take it out of this list, or empty the key.
  staff_sources: [hubspot, headcount_tool, linkedin, web_research]
  # Signal Hire counts the people it has on file in the city, and the real staff is about that
  # times this. Our guess until the PLAN-V3 test (A4, B1) gives the real ratio.
  headcount_tool_multiplier: 2
  # required: use a Signal Hire count only when its Company API has matched the company name to one
  # of its own company pages. optional: also use the name as typed when it can't be checked, and
  # the lead card says so. auto: required while the Company API answers, and the name as typed
  # while it is switched off. Our account's Company API is off (a 403, checked 2 Nov), so auto
  # uses the name as typed now, and turns strict by itself once support switches it on: a short
  # or common name can match other companies' people.
  headcount_tool_name_check: auto

# Which source is main for which data (PLAN-V4 C2). In each list the first source with a value is
# the one the rules use, and the sources after it are the backup: they fill in only when the ones
# before have nothing. The other values stay on the lead card, and a big gap raises a flag for a
# person to check. A source that isn't listed isn't asked, so taking headcount_tool out of one list
# turns Signal Hire off for that data, with no code change. Staff numbers have their own list,
# size.staff_sources. Everything else (triggers, owner, lease end, office size, healthy business,
# office history) comes from the web research alone.
data_sources:
  company_details: [headcount_tool, web_research] # the checked name, website and industry. Reading them costs 1 Signal Hire company credit, once a month for each company
  office_cities: [headcount_tool, web_research] # the cities with an office, and the head office
  decision_makers: [headcount_tool, web_research] # the names and job titles of senior people

conflicts:
  staff_gap_ratio: 2 # staff numbers from two sources more than this many times apart raise a flag

fitout:
  rate_per_m2_aud: 1500 # the minimum rate in the deal criteria

industries:
  # PLAN-V16 T1-3: Government, Law firms, Premium banks and finance and Standard not-for-profits are
  # left out now (`exclusions` below), not a Director's decision. Education, real estate agencies
  # and hospitals aren't in Levi's list of exclusions, and neither are industry consultants, so
  # they stay a Director review (TBC).
  director_review:
    - Education
    - Industry consultants
    - Real estate agencies
    - Hospitals and healthcare
  check_office_size: # site-heavy industries. A flag when it isn't clear that the office matters, and an exclusion when it is clear it doesn't
    - Construction
    - Civil engineering
    - Mining and metals
    - Machinery
    - Manufacturing
    - Food and beverages
    - Retail
    - Automotive
    - Hospitality
    - Transport and logistics
  # Industry tiers from the Target Customer Profile. A tier adds points to the score. It never
  # decides whether a company fits.
  tier_1:
    - Energy and infrastructure
    - Mining and resources
    - Technology and telecommunications
    - Engineering and technical services
  tier_2:
    - Defence and advanced manufacturing
    - Life sciences and medtech
    - Selected financial and corporate services
    - Other corporate professional services

# Left out and not scored (Levi's section 3, PLAN-V16 T1-3, Criteria_v3.md). An excluded lead is a
# Drop that shows its reason and its evidence. A person with the Lead Finder tick can override it,
# and the lead is then judged again without the exclusion. They replace the Director review for these
# industries. Every one is TBC with Levi. The code is scoring._exclusion.
exclusions:
  - id: government
    label: Government department or agency
    kind: industry
    industry_groups: [Government]
    meaning: a government department or agency. A government-owned corporation or a commercialised body is not in it, and its owner says so
    unless: [government-owned, state-owned, commonwealth-owned, commercialised]
    flag: A government-owned or commercialised body. Flagged, not left out
  - id: not_for_profit
    label: Not-for-profit or charity that relies on grants or donations
    kind: industry
    industry_groups: [Standard not-for-profits]
    meaning: a charity or not-for-profit that relies on grants or donations. A large member-owned organisation, like an industry super fund or a member-owned insurer, is not in it
    unless: [industry super fund, superannuation fund, member-owned, mutual insurer, mutual bank]
    flag: A large member-owned organisation, not a not-for-profit. Flagged, not left out
  - id: law_firm
    label: Law firm
    kind: industry
    industry_groups: [Law firms]
    meaning: a law firm of any size, tier one and national firms most of all
  - id: big_bank
    label: Big four bank or tier-one financial institution
    kind: industry
    industry_groups: [Premium banks and finance]
    meaning: only the big four banks and other tier-one financial institutions that buy design apart from delivery. A mid-tier bank, an insurer or a fund manager is not in it
    # Insurance and mid-tier financial services are priority sectors in Levi's notes (section 2). The
    # old group held them too (Budget Direct, an insurer), so these words save a saved lead too.
    unless: [insurance, insurer, fund manager, funds management, investment management, wealth management, customer-owned, mutual, credit union, building society]
    flag: An insurer, a fund manager or a customer-owned bank, not a big bank. Flagged, not left out
  - id: office_incidental
    label: The office is incidental (most local staff are not office staff)
    kind: office_incidental # office_matters is false, in a site-heavy industry (check_office_size)
  - id: tender_only
    label: Buys its fitouts only through formal public tender portals
    kind: tender_only # the fact tender_only is true: AusTender, Tenders VIC, Tenders WA, SA Tenders

fit:
  local_team_runs_project: true
  healthy: true # not in administration, and not cutting staff fast

office_age:
  due_years: 5 # more than this many years at the same address adds points (Levi's brief says 5 to 8)
  recent_move_years: 3 # a move or fitout in the last 3 years lowers the rank
  # A move or fitout in the last this many months makes a lead a Watch, even with a sign: the company
  # has probably just set up its office (Levi, 9 Nov: Budget Direct, PLAN-V11 B3). A Drop stays a Drop.
  just_moved_months: 12
  # An old office (Levi, 9 Nov, PLAN-V11 C1): this many years or more at the same address, with no
  # move or fitout known since, is a main sign of its own (tenure_sign). The code adds it from the
  # office dates, never Claude, and it has no discovery search.
  tenure_years: 8
  tenure_sign: long_tenure
  # Levi's section 4 (PLAN-V16 T1-4): "no known fitout at that address in the last 5 years". A fitout
  # longer ago than this doesn't stop the sign, and the move-in's own doesn't count.
  tenure_fitout_years: 5
  # The lead card's "Why now" (PLAN-V12 B1) guesses when a lease may end from the move-in year: the
  # move-in year plus 5 to 7 years. Always marked "estimated", with its working. It never changes a
  # result or a score.
  lease_guess_years: [5, 7]

triggers:
  window_years: 3
  best_window_years: [1, 3]
  recent_months: 18 # Levi's section 4 (PLAN-V16 T1-4): ignore a sign older than this, unless it is a lease or tenure date. Was 12
  consultant_window_months: 18 # the Profile: a consultant is usually appointed this long before the project. The lead card says so as text, because the tool can't see it
  # Each sign has a strength (Levi's section 4, PLAN-V16 T1-4): very_high, high, medium or low. The
  # strength is how much it counts in the score (T1-6). The group (main, other, weak) is only which
  # signs a run searches for by default: the main ones. The ids stay, so old leads keep their signs.
  main:
    - id: lease_ending
      label: Lease ending in 1 to 3 years, or a relocation
      strength: very_high
    - id: merger_or_takeover # PLAN-V11 B1, Levi 9 Nov: even with an old office, a merger can still lead to a move
      label: Merger or acquisition
      strength: high
    - id: big_new_contract # PLAN-V11 B1, Levi 9 Nov: "about 100 more office staff" was too specific
      label: Big new contract or project award that means a large increase in office staff
      strength: high
    - id: fast_growth
      label: Fast or planned headcount growth, like many job ads, big funding or growth news
      strength: high # Levi: a hiring surge, open roles of 25% or more of the local staff
    - id: new_to_australia # PLAN-V9 B3, Levi 5 Nov. Its size comes from the staff or office it announces here
      label: An overseas company opening its first or a much bigger office in an Australian city
      strength: high
    - id: hot_industry_growth # PLAN-V9 B4, Levi 2 Nov. Its searches name the industries (queries.yaml)
      label: Growing because its industry is booming, like the energy transition, defence or critical minerals
      strength: medium # Levi calls it a sector tailwind. A good lead with it also starts the competitor sweep (rivals.also_after)
    - id: long_tenure # PLAN-V11 C1, Levi 9 Nov. Added by the code from the office dates (office_age.tenure_years), so it has no search
      label: At the same address for 8 or more years, with no known fitout there in the last 5 years
      strength: very_high # Levi: 10 or more years is the strongest (T1-6 gives it more points)
    - id: capital_raise # PLAN-V16 T1-4, Levi's section 4. New
      label: Capital raise or funding, like a Series B or later, private equity, an IPO or a big debt raise, with growth plans
      strength: high
    - id: tenant_advisor # PLAN-V16 T1-4, Levi's section 4. New. Property Daily's "requirement" items are this sign too (T1-8)
      label: Appoints a tenant representation agent, or is in leasing news as looking for space
      strength: high
  other:
    - id: office_consolidation
      label: Merging several offices into one
      strength: medium
    - id: return_to_office
      label: Return to office
      strength: medium
    - id: restructure
      label: Restructure
      strength: medium
    - id: new_ceo # the id stays, so old leads keep their label. Moved up from weak in version 2
      label: Leadership change that changes direction or strategy
      strength: medium
    - id: new_business_unit
      label: New business unit
      strength: medium # Levi's notes don't list it: version 2's other signs stay medium (TBC)
    - id: new_facility
      label: New engineering, project or manufacturing facility with a big office part
      strength: medium
    - id: underperforming_workplace
      label: Underperforming workplace, or a major business or industry change
      strength: medium
  weak:
    - id: culture_change
      label: Culture change
      strength: low
    - id: hiring_push # the id stays. The label is the Profile's wording
      label: Pressure on talent, client experience or productivity, like a hiring push
      strength: low
    - id: rival_growth # PLAN-V9 B5. It has no search: it comes from the rivals table (below)
      label: A rival of a booming company
      strength: low
    - id: growth_list # PLAN-V16 T1-4, Levi's section 4. New: AFR Fast 100, Deloitte Technology Fast 50 and the like
      label: On a growth list, like the AFR Fast 100 or the Deloitte Technology Fast 50
      strength: low # low on its own: it supports other signs

# Rivals of a booming company (PLAN-V9 B5, Levi 2 Nov). When a lead in one of these tiers is a Pass or
# a Director review, one Claude web search names up to per_lead Australian rivals with an office in
# the same city. The next discovery run for that city adds up to per_run of them to its list, with
# the weak sign below, so real news still ranks first. Set enabled to false to stop it.
# Levi's competitor sweep (section 4): it also runs for a good lead with a sector tailwind sign,
# whatever its sector (`also_after`, PLAN-V16 T1-4).
rivals:
  enabled: true
  tiers: [tier_1, tier_2]
  also_after: [hot_industry_growth]
  per_lead: 5
  per_run: 5
  max_searches: 2 # web searches in the one request (about US$0.05 to US$0.10, TBC)
  sign: rival_growth

# What Claude may report as evidence for the score. Each earns points in a score check below,
# except can_pay: the Profile has no place for it, so it only shows on the card (and may break ties).
boosters:
  - id: buys_strategy
    label: Talks about culture, hybrid work or green-building ratings (NABERS, Green Star), and hires firms directly
  - id: no_rival_in_place
    label: Not in a competitor's case studies from the last 5 years
  - id: can_pay
    label: Profitable, growing or recently raised money

never_suggest:
  already_sent: true
  open_deal: true
  dissolved_deal_wait_months: 12
  do_not_contact: true

sources_rank: [property_daily, asx_or_official_news, other_news, job_ads]

# Which websites count as which kind of source. A site matches its subdomains too.
# Anything not listed is other_news. The company's own website counts as official.
source_domains:
  property_daily: [] # off in version 1
  asx_or_official_news: [asx.com.au, gov.au, wgea.gov.au, abr.business.gov.au, asic.gov.au]
  job_ads: [seek.com.au, indeed.com, jora.com, linkedin.com, glassdoor.com]
  blocked: # sites we never read: contact-data sellers (personal data), and Property Daily
    - propertydaily.com.au # off until its terms allow a program to read it (TBC with Levi)
    - zoominfo.com
    - rocketreach.co
    - signalhire.com
    - contactout.com
    - lusha.com
    - apollo.io

# The score, 0 to 100: the Target Customer Profile's six parts (Criteria_v2.md section 6). The parts
# add up to 100, and the checks inside each part add up to the part (the backend checks this).
# The checks and their points are our proposal, TBC until Levi fills in the Importance column.
# A check is "not known yet" when the tool can't judge it for a lead, and then it adds nothing to
# "checked". The tool shows points earned out of points checked, like "48 of 60 checked".
score:
  parts:
    trigger: { label: Business or property trigger, points: 25 }
    size: { label: Project size, points: 20 }
    timing: { label: Timing, points: 15 }
    access: { label: Decision-maker access, points: 15 }
    fit: { label: Integrated strategic fit, points: 15 }
    competition: { label: Competitive opportunity, points: 10 }
  check_labels:
    trigger_group: The best trigger
    source: How strong its source is
    size: Office size
    recency: How recent the trigger is, or how near the lease end
    years_at_address: Years at the same address
    no_recent_move: No recent move or fitout
    contact_role: A contact role found
    hubspot_contact: A contact already in HubSpot
    customer_link: A link to a current customer
    buys_strategy: Talks about culture, hybrid work or green ratings
    industry_tier: Industry tier
    no_rival_in_place: Not in a competitor's case studies
    no_contractor_relationship: No known fitout contractor relationship
  trigger_group: { main: 15, other: 10, weak: 4 } # the best trigger counts
  source: { property_daily: 10, asx_or_official_news: 8, other_news: 5, job_ads: 2 }
  size: { confirmed_in_range: 20, estimated_in_range: 16, growing_into_range: 14, director: 10 }
  recency: # timing: how long ago the best trigger happened
    - { within_days: 30, points: 6 }
    - { within_days: 90, points: 4 }
    - { within_days: 365, points: 2 }
  undated: 1
  lease_in_best_window: 6 # a lease ending 1 to 3 years out
  years_at_address: 7 # more than office_age.due_years at the same address. Was 5 (Levi, 9 Nov: check how long it has been at its office, PLAN-V11 B5)
  no_recent_move: 2 # no move or fitout in the last office_age.recent_move_years. Was 4: B3 now makes a very recent move a Watch
  access: { contact_role: 5, hubspot_contact: 5, customer_link: 5 }
  fit: { buys_strategy: 8, tier_1: 7, tier_2: 4 }
  competition: { no_rival_in_place: 6, no_contractor_relationship: 4 }
  unseen: [hubspot_contact, customer_link, no_contractor_relationship] # the tool can't judge these yet
  bands: { research_first: 75, investigate: 50 } # under investigate is "nurture" (the Profile)
  band_basis: scaled # scaled: points earned out of points checked, then x100. raw: points earned

results: [pass, director_review, watch, drop]

# The Profile's stage for each result (Criteria_v2.md section 8). The tool decides only these
# first stages. The third, a qualified deal, comes after sales meets the client (DEAL.md).
stages:
  pass: Active prospect
  director_review: Active prospect
  watch: Target account
  drop: Not a target

tbc:
  - key: size.staff_counted_in
    note: Question 6. Does 50+ staff mean in that city, or across the whole company?
  - key: size.m2_per_staff
    note: Question 8. Is 10 m² per person right?
  - key: size.staff_min
    note: Levi, 9 Nov, 50+ staff fits (PLAN-V11 B2). It was 100, from his brief. The HubSpot watchlist starts here, so it lists more companies.
  - key: size.staff_hint_min
    note: Levi, 9 Nov, 50+ staff fits (PLAN-V11 B2). It was 75+ (5 Nov), and 100+ in one office in his brief. With staff_floor also 50, a size worked out from staff is no longer a Watch for being small. Open with Levi, is a 50-staff company a lead even when it isn't growing? 50 staff at 10 m² is about 500 m², half the 1,000 m² minimum, a fitout of about $750k against the $1.5M minimum.
  - key: size.staff_floor
    note: Levi said about 50 if growing (5 Nov), and 50+ fits (9 Nov). Under 50 staff, worked out from staff, is a Drop unless the company is growing. Levi's team confirms the number (PLAN-V9 A3).
  - key: size.growth_signs
    note: Our proposal (PLAN-V9 B2). A company found with one of these signs is researched even when HubSpot and Signal Hire say it is small.
  - key: size.staff_sources
    note: The order from the 27 Oct meeting. HubSpot first, then a headcount tool (Signal Hire), then LinkedIn doubled, then the AI's web research. The first source with a number wins, and the others stay on the lead card (PLAN-V4 C3); before that, HubSpot and Signal Hire only filled a gap. Signal Hire is on since 2 Nov, before its test (PLAN-V3 A4, B1) shows how far its counts can be trusted. Our export has a LinkedIn staff count for most offices, but no office size, no manual headcount, and almost no lease expiry or last-moved dates.
  - key: data_sources
    note: Our proposal (PLAN-V4). Signal Hire is main for the checked company name, website and industry, for the cities with an office, and for senior people's names. The web research is the backup. When two sources disagree, the main source wins and both values stay on the lead card. Levi confirms.
  - key: conflicts.staff_gap_ratio
    note: Our guess. Both doublings (LinkedIn x 2, Signal Hire x 2) are guesses, so two numbers 1.5 times apart are normal. Over 2 times apart raises a flag. The test of 5 companies (PLAN-V4 D2) shows what is normal.
  - key: size.headcount_tool_multiplier
    note: Signal Hire counts only the people it has on file, which is fewer than the real staff. 2 is our guess, like LinkedIn. The test of 5 companies (PLAN-V3 A4) gives the real ratio, and B1 sets the number. Levi confirms.
  - key: size.headcount_tool_name_check
    note: A short or common name can match other companies' people. required uses a Signal Hire count only when its Company API has matched the company name. optional also uses the name as typed, and the lead card says the name was not checked. auto is required while the Company API answers, and optional while it is off. Our account's Company API is off (checked 2 Nov), so auto works like optional for now, and turns strict by itself once support switches it on. Levi confirms, after the test shows whether the two give the same counts.
  - key: size.grow_into_range_months
    note: Levi's 29 Oct email says a small company that will soon grow into the range counts (Southern Launch, 30 to 40 staff, funding for 150). He didn't say how soon. 24 months is our guess.
  - key: size.director_band_m2
    note: Relaxes Levi's 1,000 m² rule. Alvarez & Marsal at 800 m² is Contour Validated.
  - key: size.linkedin_staff_multiplier
    note: LinkedIn shows about half the real staff (median 0.51 across 19 HubSpot companies).
  - key: industries.check_office_size
    note: Version 2 judges the office, not the industry (a miner's head office counts). A site-heavy industry gets a flag when the AI can't tell whether the office matters. Since PLAN-V16 T1-3, when the AI says the office doesn't matter in one of these industries, the company is left out (the exclusion office_incidental, Levi's section 3). In any other industry that answer is still only a flag.
  - key: industries.director_review
    note: Version 2's list without Government, Law firms, Premium banks and finance and Standard not-for-profits, which are exclusions now (PLAN-V16 T1-3). Education, real estate agencies, hospitals and industry consultants stay a Director review, because Levi's notes don't list them as exclusions. Industry consultants may not need one, since his notes make professional services (not legal) a priority sector. Levi to say.
  - key: exclusions
    note: Levi's section 3 (15 Nov, PLAN-V16 T1-3). Six kinds of company are left out and not scored, each with its reason and evidence, and a person can override one. Our readings, all TBC. All law firms are left out (his notes say "especially tier one and national"). Only the big four banks and other tier-one institutions are, not an insurer, a fund manager or a customer-owned bank, because insurance and mid-tier financial services are priority sectors. A government-owned corporation and an industry super fund are flagged, not left out. Tender portals count only when they are the company's only route.
  - key: industries.tier_1
    note: From the Target Customer Profile, which leadership hasn't approved. Question 1 for Levi.
  - key: industries.tier_2
    note: Defence is Tier 2 today, but 5 of the 23 Gold customers are defence or secure sites. Question 1 for Levi.
  - key: fit.local_team_runs_project
    note: Was "decides locally". Some of Contour's clients are owned overseas.
  - key: fit.healthy
    note: Our proposal.
  - key: triggers.best_window_years
    note: Our proposal. Closer than 1 year, a consultant is probably already hired.
  - key: boosters
    note: The three kinds of evidence Claude may report. All our proposals. can_pay is not scored, because the Profile has no place for it (TBC, use it only to break ties).
  - key: never_suggest.dissolved_deal_wait_months
    note: The 12 months is a guess.
  - key: office_age.due_years
    note: Levi's brief says 5 to 8 years at the same address. Gemini's meeting summary said 7 to 8, and the written sources win. We start at the low end, 5, because it adds points and never filters.
  - key: office_age.recent_move_years
    note: Answered by the documents. A recent move or fitout means the last 3 years.
  - key: office_age.just_moved_months
    note: From Levi's 9 Nov example (Budget Direct had already set up its new Adelaide office when his run found it). The 12 months is our guess (PLAN-V11 B3).
  - key: office_age.tenure_years
    note: Levi, 9 Nov, a second search for companies 8+ years at the same address with no known office project (PLAN-V11 C1). Open with Levi, the 8 years, and whether an old office alone is a Pass (a main sign, as now) or a Director review.
  - key: office_age.lease_guess_years
    note: Our proposal (PLAN-V12 B1). Office leases often run 5, 7 or 10 years, with options, so the guess is often wrong. It shows only on the lead card's Why now, marked estimated, and never changes a result or a score. Levi to confirm 5 to 7.
  - key: triggers.consultant_window_months
    note: From the Profile and DEAL.md. Shown as text on the lead card. The tool can't see when a consultant is appointed.
  - key: triggers
    note: Version 2 adds three triggers (new facility, new business unit, underperforming workplace) and moves the leadership change up from weak to other, counting only when strategy changes. All from the Profile and Levi's brief, none confirmed.
  - key: triggers.main
    note: PLAN-V9 adds new_to_australia (Levi, 5 Nov) and hot_industry_growth (Levi, 2 Nov) to the main signs, so the schedules look for them. Whether they are main signs is for Levi. PLAN-V16 T1-4 adds capital_raise and tenant_advisor (Levi's section 4, both high), so a default run searches 8 signs, not 6, and each city's schedule too.
  - key: rivals
    note: Our proposal (PLAN-V9 B5). Whether rivals with no news of their own are wanted is for Levi (PLAN-V9 A3). At most 5 a run, and the weak sign ranks them after real news. Levi's competitor sweep (section 4) also runs after a sector tailwind sign (also_after, PLAN-V16 T1-4), whatever the lead's sector.
  - key: cities.groups
    note: Al-khair asked for all of Australia (15 Nov, PLAN-V16 T1-2). Levi's notes name Melbourne, Adelaide and Perth as priority and Sydney and Brisbane as secondary. The capitals (Canberra, Hobart, Darwin) and the 12 regional centres are our list, and so is the rule that any place passes. A place not on the list passes too, with the flag "check the city". Sydney is no longer a Director's decision, because his notes call it secondary.
  - key: cities.national
    note: Our proposal (PLAN-V16 choice 10). "All of Australia" is one search for each sign, not one for each place (20 places x 6 signs would be 120 searches). The research then finds each company's city.
  - key: cities.no_city_director_signs
    note: Our proposal (PLAN-V9 B3). An overseas company new to Australia with no Australian city named yet goes to a Director, not to Watch.
  - key: triggers.recent_months
    note: Levi's section 4 (PLAN-V16 T1-4) says to ignore a sign older than 18 months, unless it is a lease or tenure date. It was 12 months, our guess. The score's "other signs within 12 months" keeps its own 12 (T1-6).
  - key: triggers.other
    note: The strengths are Levi's (section 4, PLAN-V16 T1-4). Where his notes are silent, version 2's other signs (new business unit, new facility, underperforming workplace) are medium, and the weak signs (culture change, hiring push, a rival of a booming company) are low. That is our reading. A strength is how much a sign counts in the score (T1-6). The group (main, other, weak) is only which signs a run searches for by default.
  - key: office_age.tenure_fitout_years
    note: Levi's section 4 (PLAN-V16 T1-4), long tenure. 8 or more years at the address, a company that is stable or growing, and no known fitout there in the last 5 years. A year is enough for the move-in ("at this address since at least 2017"). Ten or more years is the strongest, so T1-6 gives it more points in the score.
  - key: source_domains
    note: First draft. The test set will show which sites matter.
  - key: score
    note: The six parts are the Profile's, which leadership hasn't approved. The checks inside them and all their points are our proposal, until Levi fills in the Importance column. Three checks can't be judged yet (a contact in HubSpot, a link to a current customer, no known contractor relationship). On 9 Nov Levi asked to weigh the years at the address more, so Timing is now 6 for the trigger's timing, 7 for the years at the address (was 5) and 2 for no recent move (was 4). Those numbers are TBC (PLAN-V11 B5).
  - key: score.band_basis
    note: Our proposal. With scaled, 48 of 60 checked counts as 80 for the band. Raw would use 48.
