# Lead Finder company criteria.
# Source: projects/leads/criteria/COMPANY.md (preliminary, 25 Oct 2026).
# Edit this file when Levi changes a rule. The backend checks it at start-up and won't
# start if it's wrong. Anything not confirmed is listed under "tbc" at the bottom.

label: Preliminary, 25 Oct 2026

cities:
  pass: [Melbourne, Adelaide, Perth]
  director_review: [Sydney]
  other_cities: director_review # "Sydney or another city" goes to a Director

size:
  staff_min: 100 # the brief's "100+ in one office". The HubSpot watchlist lists companies from here
  staff_hint_min: 75 # the Profile's "75+ office staff". When judging a lead, a size worked out from staff is only a hint: below this it gets a "check office size" flag, never a Drop
  staff_max: 600 # over this goes to Director review (a possible Whale Pipeline project)
  staff_counted_in: city
  office_m2_min: 1000
  office_m2_max: 6000
  m2_per_staff: 10 # used only when the office size isn't known
  director_band_m2: [800, 1000] # a KNOWN office just under the minimum goes to a Director, not Drop
  linkedin_staff_multiplier: 2 # real staff is about LinkedIn staff x 2
  grow_into_range_months: 24 # a small company that will need an office in range within this long still fits

fitout:
  rate_per_m2_aud: 1500 # the minimum rate in the deal criteria

industries:
  director_review:
    - Government
    - Education
    - Industry consultants
    - Law firms
    - Premium banks and finance
    - Real estate agencies
    - Standard not-for-profits
    - Hospitals and healthcare
  check_office_size: # site-heavy industries. Only a hint: a flag when it isn't clear that the office matters
    - Construction
    - Civil engineering
    - Mining and metals
    - Machinery
    - Manufacturing
    - Food and beverages
    - Retail
    - Automotive
    - Hospitality
    - Transport and logistics
  # Industry tiers from the Target Customer Profile. A tier adds points to the score. It never
  # decides whether a company fits.
  tier_1:
    - Energy and infrastructure
    - Mining and resources
    - Technology and telecommunications
    - Engineering and technical services
  tier_2:
    - Defence and advanced manufacturing
    - Life sciences and medtech
    - Selected financial and corporate services
    - Other corporate professional services

fit:
  local_team_runs_project: true
  healthy: true # not in administration, and not cutting staff fast

triggers:
  window_years: 3
  best_window_years: [1, 3]
  recent_months: 12 # an event, like a merger, counts if it happened in the last 12 months
  consultant_window_months: 18 # the Profile: a consultant is usually appointed this long before the project. The lead card says so as text, because the tool can't see it
  main:
    - id: lease_ending
      label: Lease ending in 1 to 3 years, or a relocation
    - id: merger_or_takeover
      label: Merger or acquisition, where one company has an old office
    - id: big_new_contract
      label: Big new contract or project award, needing about 100 more office staff
    - id: fast_growth
      label: Fast or planned headcount growth, like many job ads, big funding or growth news
  other:
    - id: office_consolidation
      label: Merging several offices into one
    - id: return_to_office
      label: Return to office
    - id: restructure
      label: Restructure
    - id: new_ceo # the id stays, so old leads keep their label. Moved up from weak in version 2
      label: Leadership change that changes direction or strategy
    - id: new_business_unit
      label: New business unit
    - id: new_facility
      label: New engineering, project or manufacturing facility with a big office part
    - id: underperforming_workplace
      label: Underperforming workplace, or a major business or industry change
  weak:
    - id: culture_change
      label: Culture change
    - id: hiring_push # the id stays. The label is the Profile's wording
      label: Pressure on talent, client experience or productivity, like a hiring push

boosters:
  - id: property_daily_move
    label: A relocation or lease ending found in Property Daily
  - id: office_is_due
    label: Leases rather than owns, and 6+ years in the same office
  - id: buys_strategy
    label: Talks about culture, hybrid work or green-building ratings, and hires firms directly
  - id: can_pay
    label: Profitable, growing or recently raised money
  - id: no_rival_in_place
    label: Not in a competitor's case studies from the last 5 years
  - id: reachable_decision_maker
    label: A known role (COO, CFO, Head of Property) or a contact already in HubSpot

never_suggest:
  already_sent: true
  open_deal: true
  dissolved_deal_wait_months: 12
  do_not_contact: true

sources_rank: [property_daily, asx_or_official_news, other_news, job_ads]

# Which websites count as which kind of source. A site matches its subdomains too.
# Anything not listed is other_news. The company's own website counts as official.
source_domains:
  property_daily: [] # off in version 1
  asx_or_official_news: [asx.com.au, gov.au, wgea.gov.au, abr.business.gov.au, asic.gov.au]
  job_ads: [seek.com.au, indeed.com, jora.com, linkedin.com, glassdoor.com]
  blocked: # sites we never read: contact-data sellers (personal data), and Property Daily
    - propertydaily.com.au # off until its terms allow a program to read it (TBC with Levi)
    - zoominfo.com
    - rocketreach.co
    - signalhire.com
    - contactout.com
    - lusha.com
    - apollo.io

# The score, 0 to 100. Stronger and newer signs rank higher.
score:
  trigger: { main: 35, other: 25, weak: 10 } # the best trigger counts
  recency: # how long ago the best trigger happened
    - { within_days: 30, points: 20 }
    - { within_days: 90, points: 15 }
    - { within_days: 365, points: 10 }
  undated: 5
  lease_in_best_window: 20 # a lease ending 1 to 3 years out
  fit: { pass: 15, director_review: 8 }
  source: { property_daily: 15, asx_or_official_news: 12, other_news: 8, job_ads: 4 }
  booster_each: 5
  boosters_max: 15

results: [pass, director_review, watch, drop]

tbc:
  - key: size.staff_counted_in
    note: Question 6. Does 100+ staff mean in that city, or across the whole company?
  - key: size.m2_per_staff
    note: Question 8. Is 10 m² per person right?
  - key: size.staff_hint_min
    note: Levi's brief says 100+ in one office. The Profile says 75+. We start at 75, because a flag costs less than a missed lead. Levi picks, and then staff_min should match.
  - key: size.grow_into_range_months
    note: Levi's 29 Oct email says a small company that will soon grow into the range counts (Southern Launch, 30 to 40 staff, funding for 150). He didn't say how soon. 24 months is our guess.
  - key: size.director_band_m2
    note: Relaxes Levi's 1,000 m² rule. Alvarez & Marsal at 800 m² is Contour Validated.
  - key: size.linkedin_staff_multiplier
    note: LinkedIn shows about half the real staff (median 0.51 across 19 HubSpot companies).
  - key: industries.check_office_size
    note: Version 2 judges the office, not the industry (a miner's head office counts). A site-heavy industry gets a flag only when the AI can't tell whether the office matters. The AI's "the office doesn't matter" is flagged, not dropped, because it is a judgement.
  - key: industries.tier_1
    note: From the Target Customer Profile, which leadership hasn't approved. Question 1 for Levi.
  - key: industries.tier_2
    note: Defence is Tier 2 today, but 5 of the 23 Gold customers are defence or secure sites. Question 1 for Levi.
  - key: fit.local_team_runs_project
    note: Was "decides locally". Some of Contour's clients are owned overseas.
  - key: fit.healthy
    note: Our proposal.
  - key: triggers.best_window_years
    note: Our proposal. Closer than 1 year, a consultant is probably already hired.
  - key: boosters
    note: All boosters are our proposals.
  - key: never_suggest.dissolved_deal_wait_months
    note: The 12 months is a guess.
  - key: triggers.consultant_window_months
    note: From the Profile and DEAL.md. Shown as text on the lead card. The tool can't see when a consultant is appointed.
  - key: triggers
    note: Version 2 adds three triggers (new facility, new business unit, underperforming workplace) and moves the leadership change up from weak to other, counting only when strategy changes. All from the Profile and Levi's brief, none confirmed.
  - key: triggers.recent_months
    note: Our proposal. How old an event can be and still count as a trigger.
  - key: source_domains
    note: First draft. The test set will show which sites matter.
  - key: score
    note: All weights are our proposals. LEADS.md says the weights are TBC with Levi.
