# Search templates for the Lead Finder.
# The engine fills in {city}, {area}, {company}, {year} and {month_year}.
# Every trigger in criteria.yaml needs at least one discovery template.
# The areas and the wording are first drafts (TBC). The hand-test will show what works.

areas:
  Melbourne:
    cbd: [Melbourne CBD, Docklands, Southbank]
    inner: [St Kilda Road, Richmond, Cremorne, Collingwood, South Melbourne]
  Adelaide:
    cbd: [Adelaide CBD]
    inner: [North Adelaide, Kent Town, Keswick, Mile End]
  Perth:
    cbd: [Perth CBD]
    inner: [West Perth, East Perth, Subiaco, Northbridge]
  Sydney:
    cbd: [Sydney CBD]
    inner: [North Sydney, Barangaroo, Pyrmont, Surry Hills]

# Discovery: one slice is one trigger in one city.
# PLAN-V11 B4 (Levi, 9 Nov): search for plans, not openings. News of an office that has already
# opened comes too late: the company has probably chosen its fitout (Budget Direct, 6 Nov).
discovery:
  lease_ending:
    - "{city} office lease expiry {year} tenant"
    - "{city} company relocating head office"
    - "{city} office lease renewal refurbishment"
  merger_or_takeover:
    - "{city} company merger announced {month_year}"
    - "ASX takeover {city} headquartered company"
  big_new_contract:
    - "{city} company wins major contract {month_year}"
    - "{city} contract awarded expansion jobs"
  fast_growth:
    - "{city} company expansion hiring {year}"
    - "{city} fastest growing companies {year}"
    - "{city} company plans to double staff {year}"
  # PLAN-V9 B3: an overseas company opening its first or a much bigger office here (Levi, 5 Nov)
  new_to_australia:
    - "international company plans to open Australian office {city} {year}"
    - "{city} global firm plans Australian headquarters {year}"
    - "overseas company plans to expand to {city} new office jobs {year}"
  # PLAN-V9 B4: one search for each booming industry (Levi, 2 Nov: energy transition, defence and
  # some mining; which kinds of mining is TBC). To add an industry, add a line here. No code change.
  hot_industry_growth:
    - "{city} energy transition company expansion {year}"
    - "{city} defence contractor plans new office {year}"
    - "{city} critical minerals company expansion {year}"
  office_consolidation:
    - "{city} company consolidating offices into one headquarters"
  return_to_office:
    - "{city} company return to office mandate {year}"
  restructure:
    - "{city} company restructure {month_year}"
  new_ceo:
    - "{city} company appoints new CEO {month_year}"
    - "{city} company new chief executive strategy review {year}"
  new_business_unit:
    - "{city} company launches new business unit {month_year}"
  new_facility:
    - "{city} company plans new engineering or manufacturing facility with offices {year}"
    - "{city} planned project facility headquarters office {year}"
  underperforming_workplace:
    - "{city} company office underused workplace review {year}"
    - "{city} company business downturn restructure offices {month_year}"
  culture_change:
    - "{city} company culture change program {year}"
  hiring_push:
    - "{city} company hiring push {year}"

# Watchlist: each company is searched from three angles.
company:
  property:
    - "{company} {city} office lease"
    - "{company} new office {city}"
  people:
    - "{company} hiring {city}"
    - "{company} staff growth {year}"
    - "{company} leadership team"
  money:
    - "{company} contract win"
    - "{company} acquisition merger"
    - "{company} annual report lease commitments"
