# Search templates for the Lead Finder.
# The engine fills in {city}, {area}, {company}, {year} and {month_year}.
# Every trigger in criteria.yaml needs at least one discovery template.
# The areas and the wording are first drafts (TBC). The hand-test will show what works.

areas:
  Melbourne:
    cbd: [Melbourne CBD, Docklands, Southbank]
    inner: [St Kilda Road, Richmond, Cremorne, Collingwood, South Melbourne]
  Adelaide:
    cbd: [Adelaide CBD]
    inner: [North Adelaide, Kent Town, Keswick, Mile End]
  Perth:
    cbd: [Perth CBD]
    inner: [West Perth, East Perth, Subiaco, Northbridge]
  Sydney:
    cbd: [Sydney CBD]
    inner: [North Sydney, Barangaroo, Pyrmont, Surry Hills]
  # All of Australia (PLAN-V16 T1-2): the other places in criteria.yaml cities. Each has a CBD area
  # for the map and the search. Brisbane, a secondary city, has inner suburbs too.
  Brisbane:
    cbd: [Brisbane CBD]
    inner: [Fortitude Valley, South Brisbane, Milton]
  Canberra:
    cbd: [Canberra CBD]
  Hobart:
    cbd: [Hobart CBD]
  Darwin:
    cbd: [Darwin CBD]
  Gold Coast:
    cbd: [Southport, Surfers Paradise]
  Newcastle:
    cbd: [Newcastle CBD]
  Sunshine Coast:
    cbd: [Maroochydore]
  Wollongong:
    cbd: [Wollongong CBD]
  Geelong:
    cbd: [Geelong CBD]
  Townsville:
    cbd: [Townsville CBD]
  Cairns:
    cbd: [Cairns CBD]
  Toowoomba:
    cbd: [Toowoomba CBD]
  Ballarat:
    cbd: [Ballarat CBD]
  Bendigo:
    cbd: [Bendigo CBD]
  Launceston:
    cbd: [Launceston CBD]
  Mackay:
    cbd: [Mackay CBD]

# Discovery: one slice is one trigger in one city.
# PLAN-V11 B4 (Levi, 9 Nov): search for plans, not openings. News of an office that has already
# opened comes too late: the company has probably chosen its fitout (Budget Direct, 6 Nov).
discovery:
  lease_ending:
    - "{city} office lease expiry {year} tenant"
    - "{city} company relocating head office"
    - "{city} office lease renewal refurbishment"
  merger_or_takeover:
    - "{city} company merger announced {month_year}"
    - "ASX takeover {city} headquartered company"
  big_new_contract:
    - "{city} company wins major contract {month_year}"
    - "{city} contract awarded expansion jobs"
  fast_growth:
    - "{city} company expansion hiring {year}"
    - "{city} fastest growing companies {year}"
    - "{city} company plans to double staff {year}"
  # PLAN-V9 B3: an overseas company opening its first or a much bigger office here (Levi, 5 Nov)
  new_to_australia:
    - "international company plans to open Australian office {city} {year}"
    - "{city} global firm plans Australian headquarters {year}"
    - "overseas company plans to expand to {city} new office jobs {year}"
  # PLAN-V9 B4: one search for each booming industry (Levi, 2 Nov: energy transition, defence and
  # some mining; which kinds of mining is TBC). To add an industry, add a line here. No code change.
  hot_industry_growth:
    - "{city} energy transition company expansion {year}"
    - "{city} defence contractor plans new office {year}"
    - "{city} critical minerals company expansion {year}"
  # PLAN-V16 T1-4 (Levi's section 4): a capital raise, a tenant advisor and a growth list. Their
  # sources are in his section 7 (AFR, SmartCompany, Startup Daily, Crunchbase, leasing news).
  capital_raise:
    - "{city} company raises Series B funding {year}"
    - "{city} private equity investment growth capital {month_year}"
    - "{city} company IPO plans ASX listing {year}"
  tenant_advisor:
    - "{city} company appoints tenant representative office search {year}"
    - "{city} company seeking new office space leasing {month_year}"
  growth_list:
    - "AFR Fast 100 {year} {city} company"
    - "Deloitte Technology Fast 50 {year} {city}"
  office_consolidation:
    - "{city} company consolidating offices into one headquarters"
  return_to_office:
    - "{city} company return to office mandate {year}"
  restructure:
    - "{city} company restructure {month_year}"
  new_ceo:
    - "{city} company appoints new CEO {month_year}"
    - "{city} company new chief executive strategy review {year}"
  new_business_unit:
    - "{city} company launches new business unit {month_year}"
  new_facility:
    - "{city} company plans new engineering or manufacturing facility with offices {year}"
    - "{city} planned project facility headquarters office {year}"
  underperforming_workplace:
    - "{city} company office underused workplace review {year}"
    - "{city} company business downturn restructure offices {month_year}"
  culture_change:
    - "{city} company culture change program {year}"
  hiring_push:
    - "{city} company hiring push {year}"

# Watchlist: each company is searched from three angles: property, people and money, and then the
# dampeners (PLAN-V16 T1-5). A lease and tenure run (Old offices on Start a run, PLAN-V11 C2) asks
# the tenure angle's office questions in place of the property angle: the address, since when, and
# any move or fitout since.
company:
  property:
    - "{company} {city} office lease"
    - "{company} new office {city}"
  people:
    - "{company} hiring {city}"
    - "{company} staff growth {year}"
    - "{company} leadership team"
  money:
    - "{company} contract win"
    - "{company} acquisition merger"
    - "{company} annual report lease commitments"
  tenure:
    - "{company} {city} office address"
    - "{company} moved office {city}"
    - "{company} office fitout"
  # PLAN-V16 T1-5 (Levi's section 5): the dampeners are searched for on purpose, because a missed
  # one gives a false lead. At most 3 searches a company (MAX_DAMPENER_SEARCHES in rules.py).
  dampeners:
    - "{company} office fitout {city}"
    - "{company} JLL OR CBRE OR Colliers corporate real estate"
    - "{company} tender fitout"

# Levi's source groups (his section 7, PLAN-V16 T1-7): "on every run, search each source group, and
# record which source supports each fact". Each group has searches for one company (`company`,
# added to the research angles in `angles`) and, when a sign uses it, for a slice of a discovery run
# (`discovery`, added to the signs in `signs`). The backend won't start if a group is missing or
# has no search. The sites are the ones Levi names. The wording is a first draft (TBC).
source_groups:
  mergers:
    label: Mergers and acquisitions
    angles: [money]
    signs: [merger_or_takeover]
    company:
      - "{company} ACCC acquisitions register notified acquisition"
      - "{company} ASX announcement takeover or merger {year}"
      - "{company} AFR Street Talk deal"
      - "{company} FIRB approval foreign investment Australia"
    discovery:
      - "ACCC acquisitions register notified acquisition {city} {year}"
      - "AFR Street Talk {city} company merger or takeover {year}"
      - "ASX announcement scheme of arrangement {city} {year}"
  funding:
    label: Funding and growth
    angles: [money]
    signs: [capital_raise, fast_growth]
    company:
      - "{company} raises funding Series B or private equity {year}"
      - "{company} AFR Fast 100 or Deloitte Technology Fast 50"
      - "{company} Crunchbase funding SmartCompany Startup Daily"
    discovery:
      - "{city} company raises Series B funding AFR SmartCompany Startup Daily {year}"
      - "{city} private equity investment company growth plans Crunchbase {year}"
      - "AFR Fast 100 Deloitte Technology Fast 50 {city} {year}"
  hiring:
    label: Hiring
    angles: [people]
    signs: [fast_growth, hiring_push]
    company:
      - "{company} jobs SEEK {city}"
      - "{company} careers page open roles {city}"
      - "{company} LinkedIn employee count growth {year}"
    discovery:
      - "SEEK {city} company hiring many office roles {year}"
      - "{city} company careers page dozens of open roles growing team {year}"
  leases_and_tenure:
    label: Leases, moves and tenure
    angles: [property, tenure]
    signs: [lease_ending, tenant_advisor]
    company:
      - "{company} {city} lease The Urban Developer"
      - "{company} AFR Commercial Real Estate {city} lease"
      - "how long has {company} been at its {city} office address"
      - "{company} contact page {city} address Wayback Machine"
    discovery:
      - "The Urban Developer {city} office lease signed or expiring {year}"
      - "AFR Commercial Real Estate {city} tenant relocating {year}"
      - "{city} building redevelopment approval office tenants {year}"
      - "{city} landlord leasing announcement office tenant {year}"
  recent_fitouts:
    label: Recent fitouts
    angles: [dampeners, property]
    company:
      - "{company} office fitout ArchitectureAU"
      - "{company} Office Snapshots new office"
      - "{company} new office project fitout design firm {city}"
  outsourcing:
    label: Outsourcing and competitor ties
    angles: [dampeners]
    company:
      - "{company} JLL CBRE Cushman and Wakefield Colliers client case study"
      - "{company} design and build office fitout case study project page"
  leadership:
    label: Leadership change
    angles: [people]
    signs: [new_ceo]
    company:
      - "{company} new CEO appointed ASX announcement {year}"
      - "{company} leadership change media release"
    discovery:
      - "{city} company appoints new CEO transformation ASX announcement {year}"
      - "{city} new chief executive growth strategy trade press {year}"
  sector_growth:
    label: Sector growth
    angles: [money]
    signs: [hot_industry_growth]
    company:
      - "{company} industry growth energy defence infrastructure insurance {year}"
    discovery:
      - "Infrastructure Australia pipeline {city} projects staff {year}"
      - "{city} defence industry news contract AUKUS hiring {year}"
      - "{city} government budget program renewable energy zone grid investment {year}"
  procurement:
    label: Procurement
    angles: [dampeners]
    company:
      - "{company} AusTender or state tender portal fitout"
      - "{company} supplier code of conduct procurement policy"
      - "{company} annual report procurement offshore buying"
  company_facts:
    label: Company facts
    angles: [people, property]
    company:
      - "{company} annual report {year}"
      - "{company} ASIC company record"
      - "{company} WGEA Workplace Gender Equality Agency headcount"

# The sweeps (PLAN-V21 T1-3). A run a person starts may search its signs up to four times, each time
# in a new way, while it has fewer companies than its target (`target_companies`): 1 the signs' own
# searches (`discovery` above), 2 Levi's source groups for each sign, 3 each sign by sector group, and
# 4 each sign by area. One request for each sign and city in every sweep. Nothing one sweep finds goes
# into another sweep's request, so a page can't steer another search. The backend won't start when a
# sign a run can search has no sweep 2 search or no `terms`. The wording is a first draft (TBC).
sweeps:
  labels:
    signs: The signs' own searches
    sources: Levi's source groups
    sectors: By sector
    areas: By area
  # Sweep 2 for the signs no source group covers. A sign in a group (source_groups above) uses that
  # group's discovery searches, and its line here too. The sites are the kinds Levi's section 7 names.
  sources:
    big_new_contract:
      - "AusTender {city} contract awarded company {year}"
      - "ASX announcement {city} company major contract win {year}"
    new_to_australia:
      - "Austrade {city} international company opens Australian office {year}"
      - "state government {city} global company new headquarters jobs announcement {year}"
    growth_list:
      - "SmartCompany Smart50 {year} {city}"
      - "AFR Most Innovative Companies {year} {city}"
    office_consolidation:
      - "AFR Commercial Real Estate {city} company consolidating offices one headquarters {year}"
      - "The Urban Developer {city} tenant consolidates into one building {year}"
    return_to_office:
      - "AFR {city} company return to office mandate more desks {year}"
    restructure:
      - "ASX announcement {city} company restructure new operating model {year}"
    new_business_unit:
      - "ASX announcement {city} company new division launch {year}"
    new_facility:
      - "{city} development application approved company facility with offices {year}"
      - "state planning approval {city} new campus headquarters {year}"
    underperforming_workplace:
      - "AFR Commercial Real Estate {city} company subleasing surplus office space {year}"
    culture_change:
      - "{city} company workplace transformation program trade press {year}"
  # Each sign in a few words, for {terms} in sweeps 3 and 4. Every sign a run can search needs one.
  terms:
    lease_ending: office lease expiry or relocation
    merger_or_takeover: merger or takeover
    big_new_contract: wins a major contract
    fast_growth: expansion and hiring
    new_to_australia: opens its first Australian office
    hot_industry_growth: expansion and new office
    capital_raise: raises growth funding
    tenant_advisor: looking for new office space
    growth_list: on a fastest growing list
    office_consolidation: consolidating its offices
    return_to_office: return to office
    restructure: restructure
    new_ceo: appoints a new CEO
    new_business_unit: launches a new business unit
    new_facility: plans a new facility with offices
    underperforming_workplace: office review or downturn
    culture_change: culture change program
    hiring_push: hiring push
  # Sweep 3: Levi's seven priority sectors (industries.priority_sectors) in three groups. Each holds
  # its sectors once. {sector} is a group's words, one search for each group.
  sector_groups:
    - label: Energy, defence and engineering
      sectors:
        - Energy and infrastructure
        - Defence and advanced manufacturing
        - Engineering and technical services
      words: energy, renewables, defence or engineering
    - label: Technology, finance and professional services
      sectors:
        - Technology and telecommunications
        - Selected financial and corporate services
        - Other corporate professional services
      words: technology, insurance, financial or professional services
    - label: Resources
      sectors:
        - Mining and resources
      words: mining or resources head office
  sectors:
    - "{city} {sector} company {terms} {year}"
  # Sweep 4: each place, the CBD first, then the inner suburbs ({area}, as the city's area allows).
  # For all of Australia, {area} is each priority city by name.
  areas:
    - "{area} company {terms} {year}"
    - "{area} office {terms} {month_year}"
